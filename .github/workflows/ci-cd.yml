# Nemi API CI/CD: lint y build de Docker, deploy a Dokploy solo en push a main
name: Gestor Activos Backend CI/CD

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: typecheck, lint, formato y migraciones
  lint:
    name: Typecheck & Lint
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node + Bun + caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

      # Biome en modo CI: no escribe archivos, solo reporta.
      # Assist desactivado: hay imports pendientes de ordenar (se corrigen con `bun run check`)
      - name: Lint y formato (read-only)
        run: bunx biome ci . --assist-enabled=false

      - name: Verificar migraciones
        run: bun run db:check

  # Job 2: valida el Dockerfile sin publicar la imagen
  docker:
    name: Docker build
    needs: [lint]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t nemi-api:ci .

  # Job 3: dispara el deploy en Dokploy (solo push a main y con todo verde)
  deploy:
    name: Deploy to Dokploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, docker]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 10
    steps:
      # Dispara el deploy en Dokploy vía webhook autenticado
      - name: Deploy via Dokploy webhook (Cloudflare Access)
        env:
          DOKPLOY_DEPLOY_TOKEN: ${{ secrets.DOKPLOY_DEPLOY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "https://dokploy.fluxdv.icu/api/deploy/${DOKPLOY_DEPLOY_TOKEN}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-github-event: push" \
            -H "content-type: application/json" \
            -d '{"ref":"refs/heads/main","commits":[{"added":[],"modified":["README.md"],"removed":[]}],"head_commit":{"message":"Deploy from CI"}}'
          echo
          echo "Deploy solicitado a Dokploy."

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
